    <form id="quiz-form">
        <script>
            const questions = [{"q": "1. \u00bfQu\u00e9 es conducir seg\u00fan el manual?", "options": ["Manejar r\u00e1pido", "Manejar reconociendo el valor de la seguridad vial", "Pilotear un autom\u00f3vil", "Desplazarse sin importar las se\u00f1ales"], "correct": 1, "feedback": "Cap\u00edtulo 1, P\u00e1gina 5"}, {"q": "2. \u00bfC\u00f3mo se define a un 'conductor novato'?", "options": ["Alguien con menos de 18 a\u00f1os", "Quien adquiere licencia por primera vez y tiene menos de 3 a\u00f1os con ella", "Quien maneja solo de d\u00eda", "El que tiene menos de 1 a\u00f1o con licencia"], "correct": 1, "feedback": "Cap\u00edtulo 1, P\u00e1gina 5"}, {"q": "3. \u00bfQu\u00e9 tipo de conductor es el que maneja un veh\u00edculo de carga o transporte p\u00fablico?", "options": ["Novato", "Com\u00fan", "Profesional", "Experimentado"], "correct": 2, "feedback": "Cap\u00edtulo 1, P\u00e1gina 5"}, {"q": "4. \u00bfQu\u00e9 es la 'movilidad segura y sostenible'?", "options": ["Eliminar los carros", "Construir m\u00e1s autopistas", "Enfoque de sistema seguro que adec\u00faa las v\u00edas para evitar el fallo humano y reducir muertes", "Uso exclusivo de bicicletas"], "correct": 2, "feedback": "Cap\u00edtulo 1, P\u00e1gina 7"}, {"q": "5. \u00bfCu\u00e1l de los siguientes es un grupo de factores de riesgo seg\u00fan la OMS?", "options": ["Dise\u00f1o del veh\u00edculo, color y marca", "Exposici\u00f3n, posibilidad de accidente, gravedad y evaluaci\u00f3n posterior", "Precio del veh\u00edculo y marchamo", "Edad del conductor y tipo de llantas"], "correct": 1, "feedback": "Cap\u00edtulo 1, P\u00e1gina 9"}, {"q": "6. \u00bfQu\u00e9 es un accidente de tr\u00e1nsito seg\u00fan la ley?", "options": ["Una casualidad inevitable", "Acci\u00f3n culposa al transitar que produce muerte, lesiones o da\u00f1os", "Fallo mec\u00e1nico exclusivo", "Da\u00f1o intencional a la propiedad"], "correct": 1, "feedback": "Cap\u00edtulo 1, P\u00e1gina 10"}, {"q": "7. \u00bfCu\u00e1l es la principal causa de un 'choque de frente'?", "options": ["Exceso de equipaje", "Invasi\u00f3n del carril izquierdo (ej. al adelantar)", "Mal estado del clima", "Fallo en los frenos"], "correct": 1, "feedback": "Cap\u00edtulo 1, P\u00e1gina 11"}, {"q": "8. \u00bfPor qu\u00e9 ocurre generalmente una colisi\u00f3n trasera?", "options": ["Por invasi\u00f3n de carril", "Por no guardar la distancia, distracci\u00f3n o exceso de velocidad", "Por fallos de la luz direccional", "Por llantas lisas"], "correct": 1, "feedback": "Cap\u00edtulo 1, P\u00e1gina 11"}, {"q": "9. \u00bfQu\u00e9 veh\u00edculo tiene prioridad de paso absoluta en sus cruces?", "options": ["Cami\u00f3n de Bomberos", "Ambulancias", "El tren (ferrocarril)", "La polic\u00eda"], "correct": 2, "feedback": "Cap\u00edtulo 1, P\u00e1gina 16"}, {"q": "10. \u00bfQu\u00e9 es una ciclov\u00eda?", "options": ["V\u00eda para motociclistas", "Carril exclusivo para emergencias", "V\u00eda destinada exclusivamente al tr\u00e1nsito de bicicletas y peatones si no hay aceras", "V\u00eda de alta velocidad"], "correct": 2, "feedback": "Cap\u00edtulo 1, P\u00e1gina 17"}, {"q": "11. \u00bfQu\u00e9 es el espald\u00f3n?", "options": ["La secci\u00f3n central de la v\u00eda", "Secci\u00f3n contigua a la calzada para emergencias y peatones", "La acera para ciclistas", "El carril de rebase"], "correct": 1, "feedback": "Cap\u00edtulo 1, P\u00e1gina 19"}, {"q": "12. \u00bfQu\u00e9 caracteriza a una carretera primaria?", "options": ["Alta proporci\u00f3n de viajes locales cortos", "Conectan cabeceras cantonales \u00fanicamente", "Vol\u00famenes altos de tr\u00e1nsito y viajes interprovinciales/internacionales", "Son caminos de tierra"], "correct": 2, "feedback": "Cap\u00edtulo 1, P\u00e1gina 21"}, {"q": "13. \u00bfCu\u00e1l es la edad m\u00ednima general para obtener la licencia de conducir B1?", "options": ["16 a\u00f1os", "17 a\u00f1os", "18 a\u00f1os cumplidos", "21 a\u00f1os"], "correct": 2, "feedback": "Cap\u00edtulo 1, P\u00e1gina 23"}, {"q": "14. \u00bfQu\u00e9 permite conducir la licencia B-1?", "options": ["Veh\u00edculos pesados articulados", "Bicimotos y autobuses", "Veh\u00edculos de hasta 4000 kg", "Motocicletas de alto cilindraje"], "correct": 2, "feedback": "Cap\u00edtulo 1, P\u00e1gina 30"}, {"q": "15. \u00bfCu\u00e1ntos puntos m\u00e1ximos acumula una licencia expedida por 3 a\u00f1os (novato)?", "options": ["12 puntos", "8 puntos", "6 puntos", "4 puntos"], "correct": 2, "feedback": "Cap\u00edtulo 1, P\u00e1gina 35"}, {"q": "16. Si se acumula la totalidad de puntos por primera vez, \u00bfpor cu\u00e1nto tiempo se suspende la licencia?", "options": ["6 meses", "12 meses (1 a\u00f1o)", "2 a\u00f1os", "3 a\u00f1os"], "correct": 1, "feedback": "Cap\u00edtulo 1, P\u00e1gina 36"}, {"q": "17. \u00bfQu\u00e9 documento certifica la propiedad de un veh\u00edculo en Costa Rica?", "options": ["El marchamo", "La licencia de conducir", "El t\u00edtulo de propiedad emitido por el Registro Nacional", "La revisi\u00f3n t\u00e9cnica"], "correct": 2, "feedback": "Cap\u00edtulo 1, P\u00e1gina 40"}, {"q": "18. \u00bfQu\u00e9 es el derecho de circulaci\u00f3n (marchamo)?", "options": ["Un impuesto municipal", "Un seguro de vida", "Pago obligatorio anual para circular", "Una multa de tr\u00e1nsito"], "correct": 2, "feedback": "Cap\u00edtulo 1, P\u00e1gina 42"}, {"q": "19. \u00bfD\u00f3nde debe ubicarse la placa adhesiva en un autom\u00f3vil?", "options": ["En el bumper trasero", "En la puerta del conductor", "En el parabrisas delantero, extremo superior derecho", "En el retrovisor central"], "correct": 2, "feedback": "Cap\u00edtulo 1, P\u00e1gina 43"}, {"q": "20. \u00bfA qui\u00e9nes se les considera usuarios vulnerables en la v\u00eda?", "options": ["A los veh\u00edculos 4x4", "A peatones, ciclistas, motociclistas, menores y adultos mayores", "A los camiones articulados", "A los conductores profesionales"], "correct": 1, "feedback": "Cap\u00edtulo 1, P\u00e1gina 49"}, {"q": "21. \u00bfQu\u00e9 prop\u00f3sito tienen las se\u00f1ales de reglamentaci\u00f3n?", "options": ["Dar direcciones a pueblos", "Advertir peligros", "Indicar obligaciones, prohibiciones y normativas", "Decorar la v\u00eda"], "correct": 2, "feedback": "Cap\u00edtulo 2, P\u00e1gina 90"}, {"q": "22. \u00bfDe qu\u00e9 color suelen ser las se\u00f1ales de prevenci\u00f3n?", "options": ["Rojo con letras blancas", "Fondo amarillo con s\u00edmbolos negros", "Azules con letras blancas", "Verdes o azules"], "correct": 1, "feedback": "Cap\u00edtulo 2, P\u00e1gina 91"}, {"q": "23. \u00bfQu\u00e9 indican las se\u00f1ales de informaci\u00f3n?", "options": ["Los l\u00edmites de velocidad", "Prohibiciones de parqueo", "Servicios, destinos, distancias e informaci\u00f3n general", "Que hay una curva peligrosa"], "correct": 2, "feedback": "Cap\u00edtulo 2, P\u00e1gina 92"}, {"q": "24. \u00bfQu\u00e9 significa una l\u00ednea amarilla continua en el centro de la calzada?", "options": ["Se permite adelantar si no viene nadie", "Proh\u00edbe adelantar en ambos sentidos", "Divide carriles del mismo sentido", "Indica zona de parqueo"], "correct": 1, "feedback": "Cap\u00edtulo 2, P\u00e1gina 95"}, {"q": "25. \u00bfQu\u00e9 indican las l\u00edneas blancas en el pavimento?", "options": ["Divisi\u00f3n de carriles de sentidos opuestos", "Prohibici\u00f3n total de paso", "Divisi\u00f3n de carriles en el mismo sentido de circulaci\u00f3n", "Zona escolar"], "correct": 2, "feedback": "Cap\u00edtulo 2, P\u00e1gina 95"}, {"q": "26. \u00bfQu\u00e9 debe hacer al llegar a una se\u00f1al de CEDA?", "options": ["Acelerar para pasar primero", "Pitar para alertar", "Detenerse completamente siempre", "Disminuir la velocidad y detenerse solo si se aproxima otro veh\u00edculo"], "correct": 3, "feedback": "Cap\u00edtulo 2, P\u00e1gina 90"}, {"q": "27. \u00bfQu\u00e9 indica la luz amarilla fija del sem\u00e1foro?", "options": ["Acelerar r\u00e1pido para cruzar", "Detenerse siempre, es igual a la roja", "Advertencia de que la luz cambiar\u00e1 a rojo; debe detenerse si puede hacerlo de forma segura", "V\u00eda libre"], "correct": 2, "feedback": "Cap\u00edtulo 2, P\u00e1gina 101"}, {"q": "28. \u00bfQu\u00e9 prioridad impone la luz roja intermitente en un sem\u00e1foro?", "options": ["Paso libre", "Tr\u00e1nsito lento", "Equivale a una se\u00f1al de ALTO", "Equivale a un CEDA"], "correct": 2, "feedback": "Cap\u00edtulo 2, P\u00e1gina 101"}, {"q": "29. \u00bfQu\u00e9 autoridad prevalece sobre los sem\u00e1foros y se\u00f1ales verticales?", "options": ["El inspector de tr\u00e1nsito con se\u00f1ales manuales", "La se\u00f1al de ALTO", "El sem\u00e1foro", "Ninguna"], "correct": 0, "feedback": "Cap\u00edtulo 2, P\u00e1gina 103"}, {"q": "30. \u00bfCu\u00e1l es la velocidad m\u00e1xima en una zona escolar debidamente se\u00f1alizada?", "options": ["40 km/h", "30 km/h", "25 km/h", "50 km/h"], "correct": 2, "feedback": "Cap\u00edtulo 2, P\u00e1gina 103"}, {"q": "31. \u00bfQu\u00e9 se\u00f1ala una flecha blanca pintada en el carril?", "options": ["Prohibici\u00f3n de seguir", "El sentido de direcci\u00f3n que debe seguir el tr\u00e1nsito en ese carril", "Zona de peatones", "L\u00edmite de velocidad"], "correct": 1, "feedback": "Cap\u00edtulo 2, P\u00e1gina 97"}, {"q": "32. \u00bfPara qu\u00e9 sirven los 'captaluces' (ojos de gato)?", "options": ["Para medir la velocidad", "Para iluminar como focos", "Reflejar la luz de los faros para delimitar la v\u00eda de noche", "Para detener veh\u00edculos pesados"], "correct": 2, "feedback": "Cap\u00edtulo 2, P\u00e1gina 99"}, {"q": "33. \u00bfQu\u00e9 indica el tac\u00f3metro en el panel de control?", "options": ["La temperatura", "Los kil\u00f3metros recorridos", "La velocidad de rotaci\u00f3n del motor en revoluciones por minuto (RPM)", "El nivel de aceite"], "correct": 2, "feedback": "Cap\u00edtulo 3, P\u00e1gina 114"}, {"q": "34. Si se enciende un testigo luminoso de color ROJO en el panel, \u00bfqu\u00e9 significa?", "options": ["Todo est\u00e1 bien", "Atender de inmediato, es una alarma de falla grave", "Es un recordatorio de servicio pr\u00f3ximo", "Que las luces direccionales est\u00e1n puestas"], "correct": 1, "feedback": "Cap\u00edtulo 3, P\u00e1gina 113"}, {"q": "35. \u00bfQu\u00e9 se debe hacer si la aguja de temperatura del motor llega a la zona roja (H)?", "options": ["Echar agua fr\u00eda al motor", "Acelerar", "Detener el veh\u00edculo de forma inmediata para evitar da\u00f1os", "Apagar el aire acondicionado y seguir"], "correct": 2, "feedback": "Cap\u00edtulo 3, P\u00e1gina 115"}, {"q": "36. \u00bfQu\u00e9 mide el od\u00f3metro?", "options": ["Presi\u00f3n de aceite", "Temperatura ambiental", "Velocidad actual", "Distancia recorrida (kil\u00f3metros o millas)"], "correct": 3, "feedback": "Cap\u00edtulo 3, P\u00e1gina 116"}, {"q": "37. \u00bfQu\u00e9 es el '\u00e1ngulo muerto' o punto ciego?", "options": ["El retrovisor central", "El \u00e1rea de visi\u00f3n nocturna", "Zonas alrededor del veh\u00edculo que no se pueden observar desde los espejos", "La parte baja del volante"], "correct": 2, "feedback": "Cap\u00edtulo 3, P\u00e1gina 130"}, {"q": "38. \u00bfCu\u00e1l es la forma correcta de ajustar los espejos laterales?", "options": ["Para ver la calle trasera \u00fanicamente", "Para ver completamente el costado de mi propio carro", "Para ver apenas la manija de la puerta trasera, abriendo m\u00e1s la panor\u00e1mica", "Hacia el cielo"], "correct": 2, "feedback": "Cap\u00edtulo 3, P\u00e1gina 130"}, {"q": "39. \u00bfA qu\u00e9 hora es obligatorio encender la luz baja?", "options": ["De 4:00 pm a 8:00 am", "De 6:00 pm a 6:00 am", "Solo de madrugada", "De 7:00 pm a 5:00 am"], "correct": 1, "feedback": "Cap\u00edtulo 3, P\u00e1gina 135"}, {"q": "40. \u00bfCu\u00e1ndo se deben usar las luces antiniebla (hal\u00f3genos)?", "options": ["De d\u00eda", "En la ciudad para ver mejor", "Solo en condiciones clim\u00e1ticas adversas (niebla, lluvia intensa)", "Como sustituto de luces direccionales"], "correct": 2, "feedback": "Cap\u00edtulo 3, P\u00e1gina 136"}, {"q": "41. \u00bfCu\u00e1l es el peligro de conducir con llantas lisas (desgastadas)?", "options": ["Consumen menos gasolina", "Favorecen el hidroplaneo al no poder evacuar el agua", "Hacen m\u00e1s ruido", "Giran m\u00e1s r\u00e1pido"], "correct": 1, "feedback": "Cap\u00edtulo 3, P\u00e1gina 145"}, {"q": "42. \u00bfCu\u00e1l es la funci\u00f3n principal del freno ABS?", "options": ["Frenar m\u00e1s r\u00e1pido", "Bloquear las llantas para derrapar", "Evitar el bloqueo de las llantas en frenadas bruscas para mantener el control de la direcci\u00f3n", "Aumentar la potencia del motor al frenar"], "correct": 2, "feedback": "Cap\u00edtulo 3, P\u00e1gina 151"}, {"q": "43. \u00bfQu\u00e9 mantenimiento involucra cambiar fluidos y revisar sistemas antes de que fallen?", "options": ["Mantenimiento correctivo", "Mantenimiento predictivo", "Mantenimiento preventivo", "Revisi\u00f3n t\u00e9cnica vehicular"], "correct": 2, "feedback": "Cap\u00edtulo 3, P\u00e1gina 154"}, {"q": "44. \u00bfQu\u00e9 indica un testigo luminoso amarillo/\u00e1mbar (ej. 'Check Engine')?", "options": ["Fallo catastr\u00f3fico", "Falla o alerta que debe revisarse al detenerse o en un taller pr\u00f3ximamente", "Luz alta encendida", "Puerta abierta"], "correct": 1, "feedback": "Cap\u00edtulo 3, P\u00e1gina 113"}, {"q": "45. Al prepararse para el viaje, \u00bfqu\u00e9 es lo primero que debe hacerse al abordar el veh\u00edculo?", "options": ["Acelerar", "Ajustar el asiento, espejos y ponerse el cintur\u00f3n", "Encender la radio", "Revisar el marchamo"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 171"}, {"q": "46. \u00bfPor qu\u00e9 es vital ajustar correctamente el asiento antes de arrancar?", "options": ["Para dormir mejor", "Para alcanzar c\u00f3modamente los pedales, el volante y tener buena visibilidad", "Para evitar multas", "Para que los pasajeros tengan espacio"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 173"}, {"q": "47. \u00bfCu\u00e1l es la primera acci\u00f3n al iniciar el arranque (poner en marcha) de un auto manual?", "options": ["Pisar el acelerador a fondo", "Comprobar que est\u00e1 en neutro y pisar el embrague (clutch)", "Mover el volante de lado a lado", "Encender luces altas"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 176"}, {"q": "48. Al maniobrar para integrarse al tr\u00e1nsito desde la orilla, usted debe:", "options": ["Avanzar r\u00e1pido sin mirar", "Pitar para que los dem\u00e1s frenen", "Revisar los espejos, encender la direccional y ceder el paso a los veh\u00edculos en la v\u00eda", "Solo encender las luces de emergencia"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 179"}, {"q": "49. La maniobra de adelantamiento se debe realizar preferiblemente por el costado:", "options": ["Derecho", "Por el espald\u00f3n", "Izquierdo", "Por donde haya espacio"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 184"}, {"q": "50. \u00bfEn qu\u00e9 lugares est\u00e1 estrictamente PROHIBIDO adelantar?", "options": ["En rectas largas", "En calles de un sentido", "En curvas, puentes, t\u00faneles, intersecciones o donde haya l\u00ednea continua", "En zonas rurales"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 184"}, {"q": "51. Antes de realizar un adelantamiento, \u00bfcu\u00e1l es el paso crucial?", "options": ["Cerrar las ventanas", "Comprobar que no hay veh\u00edculos en contra y se\u00f1alizar la maniobra", "Tocar el claxon repetidamente", "Apagar el radio"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 187"}, {"q": "52. Al finalizar un adelantamiento, \u00bfcu\u00e1ndo debe regresar al carril derecho?", "options": ["Inmediatamente pasando al veh\u00edculo", "Cuando pueda ver el veh\u00edculo adelantado por el retrovisor central, y usando la direccional", "Cuando el otro le pite", "Nunca, debe quedarse en el carril izquierdo"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 188"}, {"q": "53. \u00bfPara qu\u00e9 maniobras est\u00e1 permitido usar la marcha atr\u00e1s (reversa)?", "options": ["Para devolverse en una calle de un sentido", "Para conducir grandes distancias", "Estrictamente para estacionar o para salir de una v\u00eda obstruida", "Para salir r\u00e1pido de una pista"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 190"}, {"q": "54. Para ejecutar un frenado seguro, se debe:", "options": ["Pisar el freno bruscamente", "Hacerlo de forma anticipada y progresiva", "Usar el freno de mano", "Solo dejar de acelerar"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 193"}, {"q": "55. \u00bfQu\u00e9 es el 'freno de motor'?", "options": ["Apagar el carro en bajada", "Un pedal extra", "Engranar marchas bajas en pendientes para que la resistencia del motor frene el veh\u00edculo sin calentar los frenos", "Frenar tirando el freno de mano"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 193"}, {"q": "56. \u00bfQu\u00e9 es la 'distancia de reacci\u00f3n' en un frenado?", "options": ["Lo que avanza el carro desde que pisa el freno hasta que para", "La distancia entre su casa y el destino", "Lo que avanza el veh\u00edculo mientras el conductor percibe el peligro y presiona el pedal", "La distancia del retrovisor"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 194"}, {"q": "57. Al acercarse a una intersecci\u00f3n no regulada (sin altos ni sem\u00e1foros), \u00bfqui\u00e9n tiene prioridad de paso?", "options": ["El veh\u00edculo m\u00e1s grande", "El que llegue m\u00e1s r\u00e1pido", "El veh\u00edculo que se aproxima por el lado derecho", "El que viene por la izquierda"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 202"}, {"q": "58. En una intersecci\u00f3n regulada por se\u00f1al de ALTO, \u00bfqu\u00e9 debe hacer?", "options": ["Detenerse solo si viene carro", "Detenerse totalmente antes de la l\u00ednea de parada, observar y luego avanzar", "Bajar la velocidad y pasar", "Pitar y pasar"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 201"}, {"q": "59. \ e permite al veh\u00edculo alcanzar la velocidad adecuada para incorporarse de manera segura a la autopista", "El carril izquierdo", "Un \u00e1rea de descanso"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 214"}, {"q": "66. \u00bfPara qu\u00e9 se utiliza el carril izquierdo en una autopista?", "options": ["Para ir m\u00e1s lento", "Para estacionarse", "Para realizar adelantamientos y veh\u00edculos de emergencia", "Para salir de la pista"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 214"}, {"q": "67. \u00bfCu\u00e1ndo se permite circular por el espald\u00f3n?", "options": ["Para adelantar en presas", "Solo para paradas de emergencia o veh\u00edculos de emergencia autorizados", "Para dejar a un pasajero", "Siempre"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 215"}, {"q": "68. \u00bfCu\u00e1l es la distancia de seguimiento recomendada (regla general en asfalto seco)?", "options": ["1 segundo", "2 a 3 segundos respecto al veh\u00edculo de adelante", "5 metros", "10 cent\u00edmetros"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 224"}, {"q": "69. En condiciones de lluvia o v\u00edas mojadas, \u00bfqu\u00e9 debe hacer con la regla de distancia?", "options": ["Aumentarla a 4 o 5 segundos", "Reducirla", "Mantener los 2 segundos", "Pasar al carril izquierdo"], "correct": 0, "feedback": "Cap\u00edtulo 4, P\u00e1gina 224"}, {"q": "70. \u00bfCu\u00e1l es la diferencia entre parar y estacionar?", "options": ["Es lo mismo", "Estacionar es detenerse con o sin chofer por tiempo indefinido; parar es detenerse moment\u00e1neamente para que alguien suba/baje", "Parar es apagar el motor", "Estacionar es frenar en un sem\u00e1foro"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 227"}, {"q": "71. Al estacionar cuesta abajo en pendiente, las llantas delanteras deben estar:", "options": ["Giradas hacia el lado contrario del ca\u00f1o", "Rectas", "Giradas hacia el lado de la acera o ca\u00f1o", "Desinfladas"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 231"}, {"q": "72. Al estacionar en reversa o perpendicular, \u00bfqu\u00e9 precauci\u00f3n se debe tener?", "options": ["Hacerlo r\u00e1pido", "Utilizar los espejos, girar la cabeza si es necesario y se\u00f1alizar para evitar puntos ciegos", "Solo ver la c\u00e1mara", "Pitar"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 234"}, {"q": "73. \u00bfA qu\u00e9 distancia de un hidrante est\u00e1 PROHIBIDO estacionar?", "options": ["1 metro", "2 metros", "5 metros", "No hay l\u00edmite"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 237"}, {"q": "74. \u00bfA qu\u00e9 distancia de una esquina (intersecci\u00f3n urbana) es prohibido estacionar?", "options": ["A menos de 10 metros", "A 2 metros", "A 5 metros", "En la esquina misma solamente"], "correct": 0, "feedback": "Cap\u00edtulo 4, P\u00e1gina 237"}, {"q": "75. Al circular en v\u00edas congestionadas (presas), usted debe:", "options": ["Cambiar de carril constantemente", "Estresarse", "Evitar obstruir la intersecci\u00f3n (respetar cuadr\u00edculas amarillas) y mantener la calma", "Usar el espald\u00f3n"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 222"}, {"q": "76. \u00bfQu\u00e9 elementos conforman la seguridad PASIVA de un veh\u00edculo?", "options": ["Los frenos, direcci\u00f3n y llantas", "Las luces y bocina", "El cintur\u00f3n de seguridad, el airbag y el apoyacabezas", "El motor y la bater\u00eda"], "correct": 2, "feedback": "Cap\u00edtulo 5, P\u00e1gina 255"}, {"q": "77. \u00bfPara qu\u00e9 sirve el cintur\u00f3n de seguridad?", "options": ["Para evitar multas", "Para evitar que los ocupantes salgan expulsados o se golpeen contra el interior en una colisi\u00f3n", "Para mantener una buena postura", "Para sujetar el volante"], "correct": 1, "feedback": "Cap\u00edtulo 5, P\u00e1gina 256"}, {"q": "78. \u00bfQu\u00e9 es el Airbag (bolsa de aire)?", "options": ["Un adorno", "Un sistema que infla un coj\u00edn en milisegundos para amortiguar el uede implicar el retiro de placas o la inmovilizaci\u00f3n del veh\u00edculo", "S\u00ed, pero se perdona si va para el taller", "Depende del inspector"], "correct": 1, "feedback": "Cap\u00edtulo 6, P\u00e1gina 305"}, {"q": "98. \u00bfQu\u00e9 puede causar que un oficial de tr\u00e1nsito retire las placas del veh\u00edculo?", "options": ["Llevar el carro sucio", "Circular sin permiso de aprendizaje, marchamo vencido o estacionar en zonas con demarcaci\u00f3n amarilla de prohibici\u00f3n", "No llevar radio", "Tener calcoman\u00edas en las ventanas traseras"], "correct": 1, "feedback": "Cap\u00edtulo 6, P\u00e1gina 301"}, {"q": "99. Si se acumulan m\u00e1s de 5 puntos pero no los suficientes para perder la licencia (acumulaci\u00f3n parcial), \u00bfqu\u00e9 restricci\u00f3n ocurre al renovar?", "options": ["No se puede renovar jam\u00e1s", "Se debe realizar trabajo comunitario o un curso de reeducaci\u00f3n vial", "Solo se paga m\u00e1s", "Le dan una licencia de otro color"], "correct": 1, "feedback": "Cap\u00edtulo 6, P\u00e1gina 35/301"}, {"q": "100. \u00bfEl oficial de tr\u00e1nsito puede retener el veh\u00edculo si el conductor se niega a realizarse la prueba de alcoholemia?", "options": ["No, debe dejarlo ir", "Solo le hace la multa y se va", "S\u00ed, negarse a la prueba es agravante y faculta a las autoridades a tomar medidas severas incluyendo detenci\u00f3n", "Solo si es reincidente"], "correct": 2, "feedback": "Cap\u00edtulo 6, P\u00e1gina 301"}];

e permite al veh\u00edculo alcanzar la velocidad adecuada para incorporarse de manera segura a la autopista", "El carril izquierdo", "Un \u00e1rea de descanso"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 214"}, {"q": "66. \u00bfPara qu\u00e9 se utiliza el carril izquierdo en una autopista?", "options": ["Para ir m\u00e1s lento", "Para estacionarse", "Para realizar adelantamientos y veh\u00edculos de emergencia", "Para salir de la pista"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 214"}, {"q": "67. \u00bfCu\u00e1ndo se permite circular por el espald\u00f3n?", "options": ["Para adelantar en presas", "Solo para paradas de emergencia o veh\u00edculos de emergencia autorizados", "Para dejar a un pasajero", "Siempre"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 215"}, {"q": "68. \u00bfCu\u00e1l es la distancia de seguimiento recomendada (regla general en asfalto seco)?", "options": ["1 segundo", "2 a 3 segundos respecto al veh\u00edculo de adelante", "5 metros", "10 cent\u00edmetros"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 224"}, {"q": "69. En condiciones de lluvia o v\u00edas mojadas, \u00bfqu\u00e9 debe hacer con la regla de distancia?", "options": ["Aumentarla a 4 o 5 segundos", "Reducirla", "Mantener los 2 segundos", "Pasar al carril izquierdo"], "correct": 0, "feedback": "Cap\u00edtulo 4, P\u00e1gina 224"}, {"q": "70. \u00bfCu\u00e1l es la diferencia entre parar y estacionar?", "options": ["Es lo mismo", "Estacionar es detenerse con o sin chofer por tiempo indefinido; parar es detenerse moment\u00e1neamente para que alguien suba/baje", "Parar es apagar el motor", "Estacionar es frenar en un sem\u00e1foro"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 227"}, {"q": "71. Al estacionar cuesta abajo en pendiente, las llantas delanteras deben estar:", "options": ["Giradas hacia el lado contrario del ca\u00f1o", "Rectas", "Giradas hacia el lado de la acera o ca\u00f1o", "Desinfladas"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 231"}, {"q": "72. Al estacionar en reversa o perpendicular, \u00bfqu\u00e9 precauci\u00f3n se debe tener?", "options": ["Hacerlo r\u00e1pido", "Utilizar los espejos, girar la cabeza si es necesario y se\u00f1alizar para evitar puntos ciegos", "Solo ver la c\u00e1mara", "Pitar"], "correct": 1, "feedback": "Cap\u00edtulo 4, P\u00e1gina 234"}, {"q": "73. \u00bfA qu\u00e9 distancia de un hidrante est\u00e1 PROHIBIDO estacionar?", "options": ["1 metro", "2 metros", "5 metros", "No hay l\u00edmite"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 237"}, {"q": "74. \u00bfA qu\u00e9 distancia de una esquina (intersecci\u00f3n urbana) es prohibido estacionar?", "options": ["A menos de 10 metros", "A 2 metros", "A 5 metros", "En la esquina misma solamente"], "correct": 0, "feedback": "Cap\u00edtulo 4, P\u00e1gina 237"}, {"q": "75. Al circular en v\u00edas congestionadas (presas), usted debe:", "options": ["Cambiar de carril constantemente", "Estresarse", "Evitar obstruir la intersecci\u00f3n (respetar cuadr\u00edculas amarillas) y mantener la calma", "Usar el espald\u00f3n"], "correct": 2, "feedback": "Cap\u00edtulo 4, P\u00e1gina 222"}, {"q": "76. \u00bfQu\u00e9 elementos conforman la seguridad PASIVA de un veh\u00edculo?", "options": ["Los frenos, direcci\u00f3n y llantas", "Las luces y bocina", "El cintur\u00f3n de seguridad, el airbag y el apoyacabezas", "El motor y la bater\u00eda"], "correct": 2, "feedback": "Cap\u00edtulo 5, P\u00e1gina 255"}, {"q": "77. \u00bfPara qu\u00e9 sirve el cintur\u00f3n de seguridad?", "options": ["Para evitar multas", "Para evitar que los ocupantes salgan expulsados o se golpeen contra el interior en una colisi\u00f3n", "Para mantener una buena postura", "Para sujetar el volante"], "correct": 1, "feedback": "Cap\u00edtulo 5, P\u00e1gina 256"}, {"q": "78. \u00bfQu\u00e9 es el Airbag (bolsa de aire)?", "options": ["Un adorno", "Un sistema que infla un coj\u00edn en milisegundos para amortiguar el impacto frontal o lateral", "Un reposacabezas", "Un flotador para agua"], "correct": 1, "feedback": "Cap\u00edtulo 5, P\u00e1gina 257"}, {"q": "79. \u00bfC\u00f3mo debe ajustarse el apoyacabezas correctamente?", "options": ["Al nivel del cuello", "La parte superior del apoyacabezas debe estar a la altura de la parte superior de la cabeza y lo m\u00e1s cerca posible de ella", "Inclinado hacia atr\u00e1s", "Al nivel de los hombros"], "correct": 1, "feedback": "Cap\u00edtulo 5, P\u00e1gina 258"}, {"q": "80. \u00bfQu\u00e9 es un Sistema de Retenci\u00f3n Infantil (SRI)?", "options": ["El asiento del conductor", "Los bloqueos de puerta", "Sillas de seguridad especiales para proteger a los ni\u00f1os seg\u00fan su peso y edad", "El cintur\u00f3n de adulto"], "correct": 2, "feedback": "Cap\u00edtulo 5, P\u00e1gina 259"}, {"q": "81. \u00bfQu\u00e9 es el fen\u00f3meno de hidroplaneo o 'aquaplaning'?", "options": ["Cuando llueve poco", "Cuando las llantas pierden contacto con el asfalto flotando sobre una capa de agua, perdiendo la direcci\u00f3n", "Conducir bajo el agua", "Lavar el carro a presi\u00f3n"], "correct": 1, "feedback": "Cap\u00edtulo 5, P\u00e1gina 265"}, {"q": "82. Si conduce con niebla densa, usted debe usar:", "options": ["Las luces altas", "Las luces de estacionamiento", "Las luces bajas y, si tiene, los faros antiniebla, adem\u00e1s de reducir la velocidad", "No encender luces"], "correct": 2, "feedback": "Cap\u00edtulo 5, P\u00e1gina 266"}, {"q": "83. \u00bfPor qu\u00e9 el uso del tel\u00e9fono celular es riesgoso al conducir?", "options": ["Gasta mucha bater\u00eda", "Combina distracci\u00f3n visual, f\u00edsica y cognitiva, reduciendo gravemente la capacidad de reacci\u00f3n", "Interfiere con el radio", "Solo por la multa"], "correct": 1, "feedback": "Cap\u00edtulo 5, P\u00e1gina 272"}, {"q": "84. \u00bfQu\u00e9 recomienda el manual si se siente con sue\u00f1o o fatiga intensa en carretera?", "options": ["Tomar caf\u00e9 y acelerar", "Subir el volumen del radio y abrir ventanas", "Detenerse en un lugar seguro, descansar o dormir por al menos 20-30 minutos", "Continuar pero despacio"], "correct": 2, "feedback": "Cap\u00edtulo 5, P\u00e1gina 275"}, {"q": "85. \u00bfC\u00f3mo afecta el estr\u00e9s y la ira a la conducci\u00f3n?", "options": ["Mejora los reflejos", "Favorece conductas agresivas, decisiones impulsivas y aumenta el riesgo de accidentes", "Ayuda a llegar a tiempo", "Mantiene despierto al conductor"], "correct": 1, "feedback": "Cap\u00edtulo 5, P\u00e1gina 276"}, {"q": "86. \u00bfC\u00f3mo afecta el consumo de alcohol en la conducci\u00f3n?", "options": ["Aumenta la visi\u00f3n", "Da m\u00e1s confianza", "Disminuye la coordinaci\u00f3n, afecta la visi\u00f3n, altera la percepci\u00f3n del riesgo y retarda los reflejos", "Mejora los sentidos"], "correct": 2, "feedback": "Cap\u00edtulo 5, P\u00e1gina 277"}, {"q": "87. \u00bfQu\u00e9 establece la ley sobre conducir bajo los efectos de drogas il\u00edcitas?", "options": ["Est\u00e1 totalmente prohibido y es sancionable", "Se permite si es medicina recetada", "No hay restricci\u00f3n si es poca cantidad", "Se permite de noche"], "correct": 0, "feedback": "Cap\u00edtulo 5, P\u00e1gina 278"}, {"q": "88. Si ocurre un accidente leve solo con da\u00f1os materiales (y veh\u00edculos se pueden mover), \u00bfqu\u00e9 puede usar?", "options": ["El claxon", "La Declaraci\u00f3n de Accidente Menor (DAM)", "Solo llamar a la polic\u00eda", "Dejar los autos en el centro de la calle"], "correct": 1, "feedback": "Cap\u00edtulo 5, P\u00e1gina 287"}, {"q": "89. En caso de un accidente de tr\u00e1nsito con personas heridas de gravedad, \u00bfqu\u00e9 NO se debe hacer?", "options": ["Llamar al 9-1-1", "Proteger la zona", "Mover a los heridos del veh\u00edculo (salvo que haya riesgo inminente de incendio o explosi\u00f3n)", "Se\u00f1alizar el accidente"], "correct": 2, "feedback": "Cap\u00edtulo 5, P\u00e1gina 288"}, {"q": "90. \u00bfQu\u00e9 protocolo general se usa en emergencias viales?", "options": ["Huir", "Proteger (el lugar), Alertar (al 911), Socorrer (a los heridos)", "Solo grabar un video", "Mover los carros r\u00e1pido"], "correct": 1, "feedback": "Cap\u00edtulo 5, P\u00e1gina 286"}, {"q": "91. Las infracciones de Categor\u00eda A (ej. ebriedad, m\u00e1s de 120 km/h) son las m\u00e1s severas, \u00bfcu\u00e1ntos puntos acumulan?", "options": ["12 puntos", "10 puntos", "6 puntos", "0 puntos"], "correct": 2, "feedback": "Cap\u00edtulo 6, P\u00e1gina 301"}, {"q": "92. Conducir con licencia suspendida o sin haberla obtenido nunca corresponde a una infracci\u00f3n tipo:", "options": ["A", "B", "C", "D"], "correct": 0, "feedback": "Cap\u00edtulo 6, P\u00e1gina 301"}, {"q": "93. Adelantar en curva, intersecci\u00f3n o puente (invasi\u00f3n de carril) se castiga como una infracci\u00f3n de categor\u00eda:", "options": ["D", "A (infracci\u00f3n muy grave)", "C", "E"], "correct": 1, "feedback": "Cap\u00edtulo 6, P\u00e1gina 301"}, {"q": "94. Las infracciones de Categor\u00eda B (como irrespetar sem\u00e1foro rojo o se\u00f1al de ALTO) \u00bfcu\u00e1ntos puntos acumulan?", "options": ["2 puntos", "4 puntos", "6 puntos", "No acumulan puntos"], "correct": 1, "feedback": "Cap\u00edtulo 6, P\u00e1gina 302"}, {"q": "95. El incumplimiento del uso del cintur\u00f3n de seguridad por el conductor o los pasajeros conlleva una infracci\u00f3n tipo:", "options": ["A", "B", "C", "D"], "correct": 1, "feedback": "Cap\u00edtulo 6, P\u00e1gina 302"}, {"q": "96. Hablar por celular sin el uso de manos libres es una falta sancionada en la Ley de Tr\u00e1nsito bajo qu\u00e9 justificaci\u00f3n principal?", "options": ["Uso de dispositivos distractores", "Velocidad temeraria", "Conducci\u00f3n inapropiada", "Irrespeto a la autoridad"], "correct": 0, "feedback": "Cap\u00edtulo 6, P\u00e1gina 303"}, {"q": "97. \u00bfConducir con el marchamo o la inspecci\u00f3n vehicular (IVE/RTV) vencida es motivo de infracci\u00f3n?", "options": ["No, solo es un aviso", "S\u00ed, y puede implicar el retiro de placas o la inmovilizaci\u00f3n del veh\u00edculo", "S\u00ed, pero se perdona si va para el taller", "Depende del inspector"], "correct": 1, "feedback": "Cap\u00edtulo 6, P\u00e1gina 305"}, {"q": "98. \u00bfQu\u00e9 puede causar que un oficial de tr\u00e1nsito retire las placas del veh\u00edculo?", "options": ["Llevar el carro sucio", "Circular sin permiso de aprendizaje, marchamo vencido o estacionar en zonas con demarcaci\u00f3n amarilla de prohibici\u00f3n", "No llevar radio", "Tener calcoman\u00edas en las ventanas traseras"], "correct": 1, "feedback": "Cap\u00edtulo 6, P\u00e1gina 301"}, {"q": "99. Si se acumulan m\u00e1s de 5 puntos pero no los suficientes para perder la licencia (acumulaci\u00f3n parcial), \u00bfqu\u00e9 restricci\u00f3n ocurre al renovar?", "options": ["No se puede renovar jam\u00e1s", "Se debe realizar trabajo comunitario o un curso de reeducaci\u00f3n vial", "Solo se paga m\u00e1s", "Le dan una licencia de otro color"], "correct": 1, "feedback": "Cap\u00edtulo 6, P\u00e1gina 35/301"}, {"q": "100. \u00bfEl oficial de tr\u00e1nsito puede retener el veh\u00edculo si el conductor se niega a realizarse la prueba de alcoholemia?", "options": ["No, debe dejarlo ir", "Solo le hace la multa y se va", "S\u00ed, negarse a la prueba es agravante y faculta a las autoridades a tomar medidas severas incluyendo detenci\u00f3n", "Solo si es reincidente"], "correct": 2, "feedback": "Cap\u00edtulo 6, P\u00e1gina 301"}];
        let score = 0;

        questionsData.forEach((q, index) => {
            const selected = document.querySelector('input[name="q' + index + '"]:checked');
            const feedbackDiv = document.getElementById('feedback-' + index);

            if (selected) {
                const selectedVal = parseInt(selected.value);
                feedbackDiv.style.display = 'block';

                if (selectedVal === q.correct) {
                    score++;
                    feedbackDiv.className = 'feedback correct';
                    feedbackDiv.innerHTML = '<strong>¡Correcto!</strong> (Fuente: ' + q.feedback + ')';
                } else {
                    feedbackDiv.className = 'feedback incorrect';
                    feedbackDiv.innerHTML = '<strong>Incorrecto.</strong> La respuesta correcta es: <em>' + q.options[q.correct] + '</em>. <br><strong>Fuente:</strong> ' + q.feedback;
                }
            } else {
                feedbackDiv.style.display = 'block';
                feedbackDiv.className = 'feedback incorrect';
                feedbackDiv.innerHTML = '<strong>No respondida.</strong> La respuesta correcta es: <em>' + q.options[q.correct] + '</em>. <br><strong>Fuente:</strong> ' + q.feedback;
            }
        });

        const resultContainer = document.getElementById('result-container');
        resultContainer.style.display = 'block';
        resultContainer.innerHTML = 'Obtuviste <strong>' + score + '</strong> de <strong>' + questionsData.length + '</strong> respuestas correctas.<br>';

        if(score >= 80) {
            resultContainer.innerHTML += '<span style="color: #28a745; font-weight:bold;">¡Excelente trabajo! Estás muy bien preparado para la prueba teórica.</span>';
        } else {
            resultContainer.innerHTML += '<span style="color: #dc3545; font-weight:bold;">Te recomendamos repasar los capítulos donde fallaste e intentarlo de nuevo.</span>';
        }

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
